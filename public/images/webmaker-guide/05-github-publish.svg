<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Optional GitHub publishing</title><desc id="d">Illustration of GitHub publishing settings for the fictional Aurora Sport Club.</desc><rect width="960" height="440" rx="18" fill="#0d1420"/><rect x="28" y="28" width="904" height="384" rx="12" fill="#f5f7fa"/><g font-family="Arial"><text x="58" y="75" fill="#16253c" font-size="25" font-weight="700">Create and publish a GitHub repository</text><rect x="58" y="112" width="25" height="25" rx="4" fill="#204a9a"/><path d="M65 124l5 5 8-11" fill="none" stroke="white" stroke-width="3"/><text x="96" y="131" fill="#16253c" font-size="15">Optional public repository</text><g fill="#52647c" font-size="13"><text x="58" y="183">GitHub account or organization</text><text x="58" y="257">Repository name</text></g><g fill="white" stroke="#aeb9c8"><rect x="58" y="194" width="390" height="40" rx="5"/><rect x="58" y="268" width="390" height="40" rx="5"/></g><g fill="#16253c" font-size="14"><text x="72" y="220">aurora-sport</text><text x="72" y="294">aurora-sport.github.io</text></g><rect x="492" y="112" width="384" height="196" rx="9" fill="#e9eef6"/><text x="520" y="151" fill="#16253c" font-size="18" font-weight="700">Studio performs</text><g fill="#42536d" font-size="14"><text x="520" y="187">1. Sign in through Git Credential Manager</text><text x="520" y="216">2. Initialize a clean main branch</text><text x="520" y="245">3. Create and push the public repository</text><text x="520" y="274">4. Enable the included Pages workflow</text></g><rect x="712" y="334" width="164" height="42" rx="5" fill="#204a9a"/><text x="747" y="360" fill="white" font-size="14" font-weight="700">Create club</text></g></svg>
