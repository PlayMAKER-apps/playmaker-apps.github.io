<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Open an existing WebMAKER club</title><desc id="d">Comparison of cloning a remote WebMAKER repository and opening a repository already stored locally.</desc><rect width="960" height="440" rx="18" fill="#0d1420"/><g font-family="Arial"><text x="40" y="66" fill="white" font-size="27" font-weight="700">Already have a WebMAKER project?</text><rect x="40" y="108" width="420" height="260" rx="12" fill="#f4f7fb"/><rect x="500" y="108" width="420" height="260" rx="12" fill="#f4f7fb"/><text x="70" y="158" fill="#204a9a" font-size="22" font-weight="700">Clone from GitHub</text><text x="530" y="158" fill="#204a9a" font-size="22" font-weight="700">Open existing project</text><g fill="#42536d" font-size="15"><text x="70" y="205">Use when the repository is not</text><text x="70" y="230">yet on this computer.</text><text x="70" y="275">Git Credential Manager signs in.</text><text x="530" y="205">Use when the repository is</text><text x="530" y="230">already cloned on this computer.</text><text x="530" y="275">Choose the local club folder.</text></g><rect x="70" y="309" width="180" height="38" rx="5" fill="#204a9a"/><text x="97" y="333" fill="white" font-size="14" font-weight="700">Clone repository</text><rect x="530" y="309" width="180" height="38" rx="5" fill="#204a9a"/><text x="551" y="333" fill="white" font-size="14" font-weight="700">Open local folder</text></g></svg>
