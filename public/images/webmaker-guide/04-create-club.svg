<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Create Club form</title><desc id="d">Illustration of a WebMAKER Studio setup form using the fictional Aurora Sport Club.</desc><rect width="960" height="440" rx="18" fill="#0d1420"/><rect x="28" y="28" width="904" height="384" rx="12" fill="#f5f7fa"/><g font-family="Arial"><text x="58" y="72" fill="#16253c" font-size="25" font-weight="700">Create a new club</text><text x="58" y="104" fill="#52647c" font-size="14">Aurora Sport Club, fictional data</text><g fill="#52647c" font-size="13"><text x="58" y="148">Club name</text><text x="492" y="148">Short name</text><text x="58" y="222">Sport</text><text x="274" y="222">Theme</text><text x="492" y="222">First season</text><text x="58" y="296">Destination</text></g><g fill="white" stroke="#aeb9c8"><rect x="58" y="158" width="400" height="40" rx="5"/><rect x="492" y="158" width="180" height="40" rx="5"/><rect x="58" y="232" width="180" height="40" rx="5"/><rect x="274" y="232" width="180" height="40" rx="5"/><rect x="492" y="232" width="180" height="40" rx="5"/><rect x="58" y="306" width="614" height="40" rx="5"/></g><g fill="#16253c" font-size="14"><text x="72" y="184">Aurora Sport Club</text><text x="506" y="184">AURORA</text><text x="72" y="258">Basketball</text><text x="288" y="258">Bold</text><text x="506" y="258">2026-27</text><text x="72" y="332">C:\Clubs\aurora</text></g><rect x="712" y="158" width="164" height="188" rx="9" fill="#204a9a"/><text x="734" y="199" fill="white" font-size="17" font-weight="700">Safe destination</text><text x="734" y="232" fill="#dce7ff" font-size="13">Existing folders are</text><text x="734" y="253" fill="#dce7ff" font-size="13">never overwritten.</text><rect x="734" y="291" width="118" height="34" rx="5" fill="#92aaff"/><text x="754" y="313" fill="#0d1420" font-size="13" font-weight="700">Continue</text></g></svg>
